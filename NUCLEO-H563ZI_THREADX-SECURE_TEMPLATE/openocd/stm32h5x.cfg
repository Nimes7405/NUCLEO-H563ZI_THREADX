# OpenOCD config for STM32H5xx family (Cortex-M33)
# This config is designed to work with HLA (ST-LINK) transport

source [find target/swj-dp.tcl]
source [find mem_helper.tcl]

if { [info exists CHIPNAME] } {
    set _CHIPNAME $CHIPNAME
} else {
    set _CHIPNAME stm32h5x
}

if { [info exists WORKAREASIZE] } {
    set _WORKAREASIZE $WORKAREASIZE
} else {
    set _WORKAREASIZE 0x8000
}

set _ENDIAN little

# STM32H563 Cortex-M33 TAPID
# SWD ID: 0x6BA02477, JTAG ID: 0x6BA00477
if { [info exists CPUTAPID] } {
    set _CPUTAPID $CPUTAPID
} else {
    # Let it auto-detect by default
    set _CPUTAPID 0x6ba02477
}

swj_newdap $_CHIPNAME cpu -irlen 4 -ircapture 0x1 -irmask 0xf -expected-id $_CPUTAPID
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu

set _TARGETNAME $_CHIPNAME.cpu0
target create $_TARGETNAME cortex_m -endian $_ENDIAN -dap $_CHIPNAME.dap -ap-num 0

$_TARGETNAME configure -work-area-phys 0x20000000 -work-area-size $_WORKAREASIZE -work-area-backup 0

# STM32H5 flash: 2MB at 0x08000000 (use stm32h7x driver which is compatible)
flash bank $_CHIPNAME.flash stm32h7x 0x08000000 0 0 0 $_TARGETNAME

# Make sure cpu0 is selected
targets $_TARGETNAME

# HSI is 64 MHz after reset
adapter speed 2000

adapter srst delay 100
reset_config srst_only

if {![using_hla]} {
    $_TARGETNAME cortex_m reset_config sysresetreq
}

$_TARGETNAME configure -event examine-end {
    echo "STM32H5 target examined successfully"
}

$_TARGETNAME configure -event reset-init {
    adapter speed 4000
}
