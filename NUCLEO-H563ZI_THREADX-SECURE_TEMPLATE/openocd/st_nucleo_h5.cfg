# OpenOCD config for STM32 NUCLEO-H563ZI board

source [find interface/stlink.cfg]

transport select hla_swd

# Set CHIPNAME before sourcing target config
set CHIPNAME stm32h5x
set WORKAREASIZE 0x8000

source [find openocd/stm32h5x.cfg]

reset_config srst_only

# Override reset-init to set adapter speed after reset
$_CHIPNAME.cpu0 configure -event reset-init {
    adapter speed 4000
}
